name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only pushes (README, screenshots, ADRs) skip CI; tag pushes always run.
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs on Linux: cheaper than macOS minutes and no macOS runner queue.
  # Keep these versions in sync with the Homebrew versions used locally.
  lint:
    runs-on: ubuntu-latest
    env:
      SWIFTFORMAT_VERSION: 0.64.7
      SWIFTLINT_VERSION: 0.65.1
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat
        run: |
          curl -sSfL -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -q /tmp/swiftformat.zip -d /tmp/swiftformat
          bin=$(find /tmp/swiftformat -type f -name 'swiftformat*' | head -1)
          chmod +x "$bin"
          "$bin" --lint . --reporter github-actions-log
      - name: SwiftLint
        run: |
          docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint \
            "ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}" --strict --reporter github-actions-logging

  # Intel runner for the same capacity reason as app-build. Apple Silicon-only
  # code paths (P/E cores) are verified locally on an M-series Mac before merge.
  core-tests:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test OsinCore
        run: make test

  # The app is built on every push, so SDK differences (CI's Xcode vs a newer local
  # Xcode) show up right away instead of when a release is tagged. Intel runners:
  # macOS arm64 runners often hit capacity limits; a universal binary builds fine on Intel.
  app-build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build universal release (unsigned)
        run: make build-release
      - name: Verify universal binary
        run: |
          bin=build/Build/Products/Release/Osin.app/Contents/MacOS/Osin
          lipo "$bin" -verify_arch x86_64
          lipo "$bin" -verify_arch arm64
