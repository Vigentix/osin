included:
  - Osin
  - Packages/OsinCore/Sources
  - Packages/OsinCore/Tests
excluded:
  - Packages/OsinCore/.build

# Formatting is SwiftFormat's job; these overlap with it.
disabled_rules:
  - trailing_comma
  - opening_brace

opt_in_rules:
  - empty_count
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - fatal_error_message
  - private_action
  - redundant_nil_coalescing
  - unowned_variable_capture

line_length:
  warning: 140
  error: 200

identifier_name:
  excluded: [id, x, y, ok, db]
